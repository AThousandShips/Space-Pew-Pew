[tool.mypy]
disallow_any_generics = true
explicit_package_bases = true
ignore_missing_imports = true
namespace_packages = true
no_implicit_optional = true
pretty = true
show_column_numbers = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
python_version = "3.10"

[tool.ruff]
target-version = "py310"
line-length = 120
preview = true
fix = true

[tool.ruff.lint]
# NOTE: Starting with `0.15.2`, ruff uses a SIGNIFICANTLY expanded set of default rules for
#  preview builds. While expanding into these new rulesets is something we're interested in,
#  we'll adopt them gradually, depending on our needs. As such, our base `select` utilizes the
#  legacy defaults.
select = ["E4", "E7", "E9", "F"]
extend-select = [
	"FA", # flake8-future-annotations.
	"I",  # isort.
	"UP", # pyupgrade.
]
ignore = [
	"UP015", # Unnecessary mode argument.
]
extend-safe-fixes = ["ALL"]

[tool.ruff.lint.isort]
sections = { metadata = ["misc.utility.scons_hints"] }
section-order = [
	"future",
	"metadata",
	"standard-library",
	"third-party",
	"first-party",
	"local-folder",
]

[tool.codespell]
enable-colors = true
write-changes = true
check-hidden = true
quiet-level = 3
builtin = ["clear", "rare", "en-GB_to_en-US"]
skip = [
	"*.gitignore",
	"*.po",
	"*.pot",
	"COPYING.json",
	"COPYING.md",
]
